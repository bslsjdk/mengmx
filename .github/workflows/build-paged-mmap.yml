name: build-paged-mmap

on:
  push:
    branches: [android-paged-mmap]
    paths-ignore:
      - "llama.cpp-android-paged-mmap-v0.6.0.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Clone llama.cpp v0.6.0
        run: git clone --depth 1 --branch v0.6.0 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Apply Android mmap patch
        run: python3 patch_paged_mmap.py

      - name: Configure
        run: cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=OFF -DGGML_VULKAN=OFF -DGGML_OPENCL=OFF -DGGML_NATIVE=OFF

      - name: Build llama-cli
        run: cmake --build llama.cpp/build --target llama-cli -j2

      - name: Package source
        run: |
          rm -rf package
          mkdir -p package/llama.cpp-android-paged-mmap-v0.6.0
          cp -a llama.cpp/. package/llama.cpp-android-paged-mmap-v0.6.0/
          cp patch_paged_mmap.py package/llama.cpp-android-paged-mmap-v0.6.0/
          cp build_v060.sh package/llama.cpp-android-paged-mmap-v0.6.0/
          cd package
          zip -qr ../llama.cpp-android-paged-mmap-v0.6.0.zip llama.cpp-android-paged-mmap-v0.6.0

      - name: Commit ZIP into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llama.cpp-android-paged-mmap-v0.6.0.zip
          git commit -m "[skip ci] add patched llama.cpp v0.6.0 ZIP"
          git push origin HEAD:android-paged-mmap
